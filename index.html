<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Fullscreen Vimeo Player with Thumbnail</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }
        
        .video-container {
            width: 80%;
            max-width: 800px;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .video-wrapper {
            /* 16:9 Aspect Ratio */
            padding: 56.25% 0 0 0;
            position: relative;
        }
        
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0); 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.3s ease, opacity 0.3s ease;
        }

        .play-button {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #333;
            transition: all 0.3s ease;
            opacity: 0;
            transform: scale(0.8);
        }
        
        .video-container:hover .click-overlay {
            background: rgba(0, 0, 0, 0.3);
        }

        .video-container:hover .play-button {
            opacity: 1;
            transform: scale(1);
        }

        .play-button:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.1) !important;
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            font-size: 16px;
            opacity: 0.8;
            pointer-events: none; /* Make sure instructions don't block clicks */
        }
        
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="video-wrapper">
            <iframe 
                id="vimeo-player"
                src="https://player.vimeo.com/video/1020508342?h=22e32fecf1&badge=0&autopause=0&player_id=0&app_id=58479" 
                frameborder="0" 
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                title="6 Inscape London Night Poem 00_3_57_00">
            </iframe>
        </div>
        <div class="click-overlay" id="clickOverlay">
            <div class="play-button">▶</div>
        </div>
    </div>
    
    <div class="instructions" id="instructions">
        Tap anywhere to enter fullscreen and play
    </div>

    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
        let player;
        let hasStarted = false;

        // Initialize Vimeo player
        function initPlayer() {
            const iframe = document.getElementById('vimeo-player');
            player = new Vimeo.Player(iframe);
        }

        // Wait for Vimeo API to load
        if (window.Vimeo) {
            initPlayer();
        } else {
            // Fallback for when the script loads after the page
            const vimeoScript = document.querySelector('script[src*="vimeo.com"]');
            vimeoScript.addEventListener('load', initPlayer);
        }

        // --- MODIFIED SECTION: Handle click/tap to play and go fullscreen ---
        document.body.addEventListener('click', function() {
            // Ensure this only runs once and the player is ready
            if (!hasStarted && player) {
                hasStarted = true;
                
                // Hide the overlay and instructions
                document.getElementById('clickOverlay').classList.add('hidden');
                document.getElementById('instructions').classList.add('hidden');
                
                // The player.play() call MUST be a direct result of the user interaction.
                // On success, we then request fullscreen. This sequence is more reliable on mobile.
                player.play().then(() => {
                    // Audio is now playing, now request fullscreen.
                    // Using player.requestFullscreen() is more mobile-friendly than the document API.
                    return player.requestFullscreen();
                }).catch(error => {
                    console.error('Error playing or entering fullscreen:', error);
                    // This could happen if the user's browser blocks the action.
                });

                // Ensure volume is on
                player.setVolume(1);
            }
        });

        // Handle video end - exit fullscreen
        // We add the event listener once the player is confirmed to be initialized.
        function setupEndListener() {
            if (player) {
                player.on('ended', function() {
                    // When the video ends, check if we are in fullscreen and exit.
                    player.getFullscreen().then(function(fullscreen) {
                        if (fullscreen) {
                            player.exitFullscreen();
                        }
                    });
                });
            } else {
                // If the player isn't ready, try again shortly.
                setTimeout(setupEndListener, 100);
            }
        }
        setupEndListener();

        // Prevent right-click context menu for cleaner experience
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
