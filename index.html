<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Fullscreen Vimeo Player with Thumbnail</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }
        
        .video-container {
            width: 80%;
            max-width: 800px;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .video-wrapper {
            padding: 56.25% 0 0 0;
            position: relative;
        }
        
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* Make overlay transparent by default */
            background: rgba(0, 0, 0, 0); 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.3s ease, opacity 0.3s ease;
        }

        .play-button {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #333;
            transition: all 0.3s ease;
            /* Hide play button by default */
            opacity: 0;
            transform: scale(0.8);
        }
        
        /* Show overlay and play button on hover */
        .video-container:hover .click-overlay {
            background: rgba(0, 0, 0, 0.3);
        }

        .video-container:hover .play-button {
            opacity: 1;
            transform: scale(1);
        }

        .play-button:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.1) !important;
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            font-size: 16px;
            opacity: 0.8;
        }
        
        .fullscreen-active .video-container {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
        }
        
        .fullscreen-active .video-wrapper {
            padding: 0 !important;
            height: 100vh;
        }
        
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="video-wrapper">
            <iframe 
                id="vimeo-player"
                src="https://player.vimeo.com/video/1020508342?h=22e32fecf1&badge=0&autopause=0&player_id=0&app_id=58479" 
                frameborder="0" 
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                title="6 Inscape London Night Poem 00_3_57_00">
            </iframe>
        </div>
        <div class="click-overlay" id="clickOverlay">
            <div class="play-button">▶</div>
        </div>
    </div>
    
    <div class="instructions">
        Click anywhere to enter fullscreen and play
    </div>

    <script src="https://player.vimeo.com/api/player.js"></script>
    <script>
        let player;
        let isFullscreen = false;
        let hasStarted = false;

        // Initialize Vimeo player
        function initPlayer() {
            const iframe = document.getElementById('vimeo-player');
            player = new Vimeo.Player(iframe);
            
            // MODIFIED: The player.pause() call is no longer needed here
        }

        // Wait for Vimeo API to load
        if (window.Vimeo) {
            initPlayer();
        } else {
            window.addEventListener('load', initPlayer);
        }

        // Handle click to enter fullscreen and play
        document.addEventListener('click', async function() {
            if (!hasStarted) {
                hasStarted = true;
                
                try {
                    // Hide the overlay
                    document.getElementById('clickOverlay').classList.add('hidden');
                    
                    // Request fullscreen
                    const element = document.documentElement;
                    if (element.requestFullscreen) {
                        await element.requestFullscreen();
                    } else if (element.webkitRequestFullscreen) {
                        await element.webkitRequestFullscreen();
                    } else if (element.msRequestFullscreen) {
                        await element.msRequestFullscreen();
                    }
                    
                    // Add fullscreen class for styling
                    document.body.classList.add('fullscreen-active');
                    isFullscreen = true;
                    
                    // Play the video and set volume
                    if (player) {
                        player.play();
                        player.setVolume(1);
                    }
                    
                } catch (error) {
                    console.log('Fullscreen request failed:', error);
                    // Still play the video even if fullscreen fails
                    if (player) {
                        player.play();
                        player.setVolume(1);
                    }
                }
            }
        });

        // Handle fullscreen change events
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('msfullscreenchange', handleFullscreenChange);

        function handleFullscreenChange() {
            const fullscreenElement = document.fullscreenElement || 
                                    document.webkitFullscreenElement || 
                                    document.msFullscreenElement;
            
            if (!fullscreenElement && isFullscreen) {
                // Exited fullscreen
                document.body.classList.remove('fullscreen-active');
                isFullscreen = false;
            }
        }

        // Handle video end - could exit fullscreen or replay
        if (window.Vimeo) {
            setTimeout(() => {
                if (player) {
                    player.on('ended', function() {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        } else if (document.msExitFullscreen) {
                            document.msExitFullscreen();
                        }
                    });
                }
            }, 2000);
        }

        // Prevent right-click context menu for cleaner experience
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
